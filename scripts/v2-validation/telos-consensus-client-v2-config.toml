# /data/telos-consensus-client/testnet-genesis/config.toml
#
# telos-consensus-client config for feeding the v2 side-by-side reth
# node (authrpc 127.0.0.1:8579) a from-genesis replay of Telos EVM
# testnet. The "translator" reads from the local nodeos state-history
# WebSocket and turns antelope blocks into EVM payloads, which are
# then driven into reth over the Engine API (engine_newPayload +
# engine_forkchoiceUpdated).
#
# The jwt_secret below MUST match the bytes of
# /data/reth-testnet-v2/jwt.hex on disk. The launcher seeds jwt.hex
# with this exact value when the file is missing.
#
# prev_hash is the canonical Telos EVM testnet genesis hash
# (block 0). If it doesn't match the hash reth reports for block 0,
# the CL will refuse to push block 1 into reth.

log_level = "info"
chain_id = 41
prev_hash = "0xb25034033c9ca7a40e879ddcc29cf69071a22df06688b5fe8cc2d68b4e0528f9"
execution_endpoint = "http://localhost:8579"
jwt_secret = "1dec866571dc8725b048e672bfd1dc5c0c3afe5e3180f707776ec908188b9084"
evm_start_block = 1
evm_deploy_block = 137430500
ship_endpoint = "ws://localhost:18081"
chain_endpoint = "http://localhost:18889"
batch_size = 500
data_path = "/data/telos-consensus-client/testnet-genesis/db"
block_checkpoint_interval = 1000
maximum_sync_range = 500000
latest_blocks_in_db_num = 1800
